name: CI

# Two things must never break:
#   1. the engine is correct (tests)
#   2. the repository ships no colour data we have no right to redistribute
#
# Note there is no install step: the project has zero runtime and dev
# dependencies, so `npm ci` would have nothing to do and no lockfile exists.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor we claim in package.json; 24 is current. Quoted so
        # YAML does not read them as numbers — a version like 20.10 would
        # otherwise become the float 20.1.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run the test suite
        run: npm test

  compliance:
    name: repository compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails if a colour book, a non-permissive CLF, a pasted swatch table or
      # a user library has been committed. This is the guard rail behind the
      # project's central promise — it only ever inspects the repository, never
      # anything the user has on their own machine.
      - name: Check that the bundled data is redistributable
        run: npm run check

      # The demo libraries and web/demo-libraries.js are generated *and*
      # committed, so regenerating them here is a genuine comparison: if either
      # drifted from its generator, this fails.
      - name: Check that committed generated data is current
        run: npm run build:docs

      # dist/ is gitignored, so a fresh clone has no bundle for --check to
      # judge — and it correctly declines to call a missing artifact stale.
      # Build it instead: this is what proves the bundler still runs over the
      # whole module graph, and that no import has crept in that it cannot
      # inline. Freshness of dist/ is a local concern, not a CI one.
      - name: Build the single-file bundle
        run: npm run build
